# Baut eine installierbare Test-APK (debug) in der Cloud – ohne Android Studio.
# Start: GitHub → Actions → "Android APK" → "Run workflow".
# Ergebnis: Release „Quran Muallem - معلم القرآن – Android Test-APK“ mit quran-muallem.apk (Link direkt am Handy öffnen).
# Mit dem Secret RELEASES_TOKEN (Fine-grained token, Contents: Read and write auf Quran-Muallem/Quran-Muallem1)
# erscheint die APK zusätzlich als Release „Version-<versionCode>“ in https://github.com/Quran-Muallem/Quran-Muallem1/releases.
name: Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          # The default list still asks for the removed package "tools" (sdkmanager exits with 1).
          packages: platform-tools

      - name: Install
        run: npm install --legacy-peer-deps

      - name: Optional – Einstellungen aus GitHub-Secrets
        run: |
          {
            echo "VITE_INVITE_URL=${{ secrets.VITE_INVITE_URL }}"
          } > .env.local

      - name: Build web assets
        run: npm run build:app

      - name: Android-Projekt anlegen & synchronisieren
        run: |
          [ -d android ] || npx cap add android
          npx cap sync android
          node scripts/native-permissions.mjs

      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../quran-muallem.apk

      - name: Version lesen
        id: ver
        run: |
          echo "code=$(node -p "require('./package.json').androidVersionCode")" >> "$GITHUB_OUTPUT"
          echo "name=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          cp quran-muallem.apk "Quran-Muallem-v$(node -p "require('./package.json').androidVersionCode").apk"

      - uses: actions/upload-artifact@v4
        with:
          name: quran-muallem-apk-v${{ steps.ver.outputs.code }}
          path: Quran-Muallem-v${{ steps.ver.outputs.code }}.apk

      - name: Als Release veröffentlichen (Download-Link fürs Handy)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-test
          name: "Quran Muallem - معلم القرآن – Android Test-APK"
          prerelease: true
          files: quran-muallem.apk

      - name: Release in Quran-Muallem1 (wenn RELEASES_TOKEN gesetzt)
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        if: env.HAS_RELEASES_TOKEN == 'true'
        run: |
          TAG="Version-${{ steps.ver.outputs.code }}"
          NOTES="Quran Muallem ${{ steps.ver.outputs.name }} (versionCode ${{ steps.ver.outputs.code }})"
          gh release view "$TAG" -R Quran-Muallem/Quran-Muallem1 >/dev/null 2>&1 || gh release create "$TAG" -R Quran-Muallem/Quran-Muallem1 --title "$TAG" --notes "$NOTES"
          gh release upload "$TAG" "Quran-Muallem-v${{ steps.ver.outputs.code }}.apk" -R Quran-Muallem/Quran-Muallem1 --clobber
